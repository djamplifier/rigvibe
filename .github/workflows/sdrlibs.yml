name: SDR-Bibliotheken testen
# Baut librtlsdr/libhackrf/SoapySDR (mit Airspy-Treibern) je System aus dem (nicht oeffentlichen) Quelltext-Repo und prueft, dass Python sie laedt.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Stand im Quelltext-Repo (Tag oder Zweig)"
        default: "main"
jobs:
  libs:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: djamplifier/rigvibe-src
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotheken
        shell: bash
        run: .github/scripts/sdrlibs.sh
      - name: SoapySDR mit Airspy-Treibern
        shell: bash
        run: .github/scripts/soapylibs.sh
      - name: Diagnose Windows
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          pip install -q numpy psutil
          for variante in hackrf iio libusb; do
          echo "--- D: nur $variante vorab, dann Soapy"
          V=$variante python -X faulthandler -c "
          import psutil, os
          from wellenwerk.sdr import usbsdr, soapy
          from wellenwerk.sdr.pluto import _iio
          v = os.environ['V']
          if v == 'hackrf': usbsdr._hrf(usbsdr._find('hackrf'))
          if v == 'iio': _iio(usbsdr._find('iio'))
          if v == 'libusb': usbsdr._libusb()
          for m in psutil.Process().memory_maps():
              b = m.path.lower()
              if b.endswith('.dll') and 'windows' not in b and 'hostedtoolcache' not in b: print('MOD', m.path, flush=True)
          print(soapy.modules(), flush=True)
          " 2>&1 | tail -14 || true
          done
      - name: Laden pruefen
        shell: bash
        run: pip install -q numpy && python -c "from wellenwerk.sdr import usbsdr, soapy; print(usbsdr.selftest()); m = soapy.modules(); print('Soapy', soapy.abi(), m); assert any('airspySupport' in x['path'] and not x['error'] and 'airspy' in x['drivers'] for x in m) and any('airspyhfSupport' in x['path'] and not x['error'] and 'airspyhf' in x['drivers'] for x in m), 'Airspy-Module fehlen'"
      - uses: actions/upload-artifact@v4
        with:
          name: sdrlibs-${{ runner.os }}-${{ runner.arch }}
          path: packaging/sdrlibs
