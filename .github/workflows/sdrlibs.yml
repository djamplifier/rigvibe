name: SDR-Bibliotheken testen
# Baut librtlsdr/libhackrf/SoapySDR (mit Airspy-Treibern) je System aus dem (nicht oeffentlichen) Quelltext-Repo und prueft, dass Python sie laedt.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Stand im Quelltext-Repo (Tag oder Zweig)"
        default: "main"
jobs:
  libs:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: djamplifier/rigvibe-src
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SRC_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotheken
        shell: bash
        run: .github/scripts/sdrlibs.sh
      - name: SoapySDR mit Airspy-Treibern
        shell: bash
        run: .github/scripts/soapylibs.sh
      - name: Diagnose Windows
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          pip install -q numpy
          echo "--- F: Dateien"; ls -l packaging/sdrlibs/*.dll packaging/sdrlibs/soapy/*.dll packaging/sdrlibs/soapy/modules/*.dll; sha256sum packaging/sdrlibs/libusb-1.0.dll packaging/sdrlibs/soapy/libusb-1.0.dll 2>&1
          echo "--- G: libusb aus sdrlibs vorab, dann Schritt fuer Schritt"
          python -X faulthandler -c "
          import ctypes, os
          r = os.path.abspath('packaging/sdrlibs'); s = r + '/soapy'
          for d in (r, s, s + '/modules'): os.add_dll_directory(d)
          for p in (r + '/libusb-1.0.dll', s + '/pthreadVC3.dll', s + '/airspy.dll', s + '/airspyhf.dll', s + '/SoapySDR.dll', s + '/modules/airspySupport.dll', s + '/modules/airspyhfSupport.dll'):
              if not os.path.exists(p): print('fehlt', p, flush=True); continue
              print('lade', p, flush=True); ctypes.CDLL(p); print('  ok', flush=True)
          " 2>&1 | tail -16 || true
      - name: Laden pruefen
        shell: bash
        run: pip install -q numpy && python -c "from wellenwerk.sdr import usbsdr, soapy; print(usbsdr.selftest()); m = soapy.modules(); print('Soapy', soapy.abi(), m); assert any('airspySupport' in x['path'] and not x['error'] and 'airspy' in x['drivers'] for x in m) and any('airspyhfSupport' in x['path'] and not x['error'] and 'airspyhf' in x['drivers'] for x in m), 'Airspy-Module fehlen'"
      - uses: actions/upload-artifact@v4
        with:
          name: sdrlibs-${{ runner.os }}-${{ runner.arch }}
          path: packaging/sdrlibs
